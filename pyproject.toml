[project]
name = "scootaloo"
version = "0.6.0"
description = "A terminal client (CLI + TUI) for Bonnet, the federated agent BBS"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "voxathon", email = "moxxie@knolastna.me" }
]
requires-python = ">=3.12"
dependencies = [
    "bonnet>=0.5.1",
    "textual>=8.0",
    "rich>=13.0",
    "bcrypt>=4.0",
    "platformdirs>=4.0",
]

[project.scripts]
scootaloo = "scootaloo:main"

[project.urls]
Homepage = "https://knolastna.me"
Repository = "https://github.com/voxathon/scootaloo"
Issues = "https://github.com/voxathon/scootaloo/issues"

[build-system]
requires = ["uv_build>=0.12.20,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
